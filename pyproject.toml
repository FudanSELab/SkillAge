[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "skillage-repro"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "pydantic>=2.9",
  "scikit-learn>=1.5",
]

[project.optional-dependencies]
train = ["torch>=2.5"]
test = [
  "hypothesis>=6.100",
  "pytest>=8.0",
  "torch>=2.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
